<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sudoku</title>
  <meta name="description" content="Sudoku with a Rust/WebAssembly solver, generator and hints. Runs entirely in your browser." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231a56db%27/%3E%3Ctext x=%2716%27 y=%2724%27 font-size=%2722%27 font-family=%27sans-serif%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3E9%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <main>
    <div id="top">
      <select id="level" aria-label="Difficulty">
        <option value="0">Easy</option><option value="1">Medium</option>
        <option value="2">Hard</option><option value="3">Expert</option>
      </select>
      <span id="mistakes" aria-live="polite"></span>
      <span id="clock"><span id="time">0:00</span> <button id="pause" aria-label="Pause">⏸</button></span>
    </div>
    <div id="grid" role="group" aria-label="Sudoku grid"></div>
    <div id="tools">
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
      <button id="erase">Erase</button>
      <button id="notes" aria-pressed="false">Notes: off</button>
      <button id="hint">Hint</button>
    </div>
    <div id="pad"></div>
    <div id="actions">
      <button id="new">New game</button>
      <button id="solve">Solve</button>
    </div>
    <p id="msg" role="status"></p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
