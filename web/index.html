<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sudoku</title>
</head>
<body>
  <main>
    <div id="top">
      <select id="level" aria-label="Difficulty">
        <option value="0">Easy</option><option value="1">Medium</option>
        <option value="2">Hard</option><option value="3">Expert</option>
      </select>
      <span id="mistakes" aria-live="polite"></span>
      <span id="clock"><span id="time">0:00</span> <button id="pause" aria-label="Pause">⏸</button></span>
    </div>
    <div id="grid" role="grid" aria-label="Sudoku grid"></div>
    <div id="tools">
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
      <button id="erase">Erase</button>
      <button id="notes" aria-pressed="false">Notes: off</button>
      <button id="hint">Hint</button>
    </div>
    <div id="pad"></div>
    <div id="actions">
      <button id="new">New game</button>
      <button id="solve">Solve</button>
    </div>
    <p id="msg" role="status"></p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
